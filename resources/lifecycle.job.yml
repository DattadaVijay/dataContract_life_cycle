resources:
  jobs:
    lifecycle_job:
      name: lifecycle_job

      tags:
        environment: dev
        domain: governance
        product: datacontract_life_cycle

      email_notifications:
        on_failure:
          - dattada.vijay@gmail.com

      tasks:
        - task_key: data_ingestion
          notebook_task:
            notebook_path: ../src/data_script.py
          environment: environment_key

        - task_key: data_contract_check
          notebook_task:
            notebook_path: ../src/data_contract_test.py
          environment: environment_key

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
