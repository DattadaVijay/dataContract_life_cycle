apiVersion: v3.1.0
kind: DataContract
id: finance-transactions-contract
name: Finance Transactions Contract
version: 1.0.0
status: draft

team:
  name: data_stewards
  description: Data stewards responsible for finance domain contracts

description:
  purpose: >
    Defines the structure and quality expectations for the finance transactions table
    in the data_contract_poc catalog. Used as part of the data contract lifecycle POC.
  usage: >
    Downstream consumers can use this table for transaction reporting,
    reconciliation, and finance analytics.
  limitations: >
    This is a POC table with dummy data. Not for production use.

schema:
  - name: transactions
    description: Finance transactions table containing payment and account activity
    properties:

      - name: transaction_id
        logicalType: string
        description: Unique identifier for each transaction
        required: true
        unique: true
        example: "TXN001"

      - name: account_id
        logicalType: string
        description: Identifier of the account associated with the transaction
        required: true
        example: "ACC001"

      - name: customer_name
        logicalType: string
        description: Full name of the customer
        required: true
        classification: pii
        example: "Alice Johnson"

      - name: transaction_date
        logicalType: date
        description: Date the transaction occurred
        required: true
        example: "2024-01-05"

      - name: amount
        logicalType: number
        description: Transaction amount in the specified currency
        required: true
        minimum: 0
        example: 1500.00

      - name: currency
        logicalType: string
        description: ISO 4217 currency code
        required: true
        enum:
          - USD
          - GBP
          - EUR
        example: "USD"

      - name: transaction_type
        logicalType: string
        description: Whether the transaction is a credit or debit
        required: true
        enum:
          - CREDIT
          - DEBIT
        example: "CREDIT"

      - name: status
        logicalType: string
        description: Current status of the transaction
        required: true
        enum:
          - COMPLETED
          - PENDING
          - FAILED
        example: "COMPLETED"

      - name: merchant
        logicalType: string
        description: Name of the merchant involved in the transaction
        required: false
        example: "Amazon"

      - name: created_at
        logicalType: timestamp
        description: Timestamp when the record was created
        required: true
        example: "2024-01-05T10:00:00Z"

servicelevels:
  freshness:
    description: Data must be refreshed at least once daily
    schedule: "0 6 * * *"
    threshold: 24h

  completeness:
    description: No nulls allowed on required fields
    threshold: 100%

  retention:
    description: Transactions data retained for 7 years
    period: 7 years