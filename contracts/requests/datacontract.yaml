apiVersion: v3.1.0
kind: DataContract
id: finance-transactions-contract
name: Finance Transactions Contract
version: 1.0.0
status: draft

team:
  name: data_stewards
  description: Data stewards responsible for finance domain contracts

servers:
  - server: production
    type: databricks
    host: dbc-e3761da8-7d95.cloud.databricks.com
    catalog: data_contract_poc
    schema: finance

description:
  purpose: >
    Defines the structure and quality expectations for the finance transactions table
    in the data_contract_poc catalog. Used as part of the data contract lifecycle POC.
  usage: >
    Downstream consumers can use this table for transaction reporting,
    reconciliation, and finance analytics.
  limitations: >
    This is a POC table with dummy data. Not for production use.

schema:
  - name: transactions
    description: Finance transactions table containing payment and account activity
    properties:
      - name: transaction_id
        logicalType: string
        description: Unique identifier for each transaction
        required: true
        isUnique: true
        example: "TXN001"

      - name: account_id
        logicalType: string
        description: Identifier of the account associated with the transaction
        required: true
        example: "ACC001"

      - name: customer_name
        logicalType: string
        description: Full name of the customer
        required: true
        classification: pii
        example: "Alice Johnson"

      - name: transaction_date
        logicalType: date
        description: Date the transaction occurred
        required: true
        example: "2024-01-05"

      - name: amount
        logicalType: number
        description: Transaction amount in the specified currency
        required: true
        example: 1500.00

      - name: currency
        logicalType: string
        description: ISO 4217 currency code
        required: true
        example: "USD"

      - name: transaction_type
        logicalType: string
        description: Whether the transaction is a credit or debit
        required: true
        example: "CREDIT"

      - name: status
        logicalType: string
        description: Current status of the transaction
        required: true
        example: "COMPLETED"

      - name: merchant
        logicalType: string
        description: Name of the merchant involved in the transaction
        required: false
        example: "Amazon"

      - name: created_at
        logicalType: timestamp
        description: Timestamp when the record was created
        required: true
        example: "2024-01-05T10:00:00Z"

slaProperties:
  - property: freshness
    value: 24
    unit: hours
    element: transactions.transaction_date

  - property: retention
    value: 7
    unit: years
    element: transactions.transaction_date